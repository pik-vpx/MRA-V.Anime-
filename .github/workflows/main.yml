name: Build Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Build Electron App
        run: npx electron-builder --win --dir -c.directories.output=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create 7z Archive
        run: |
          7z a -t7z "release/MRA-Anime-Edition-Windows.7z" "./release/win-unpacked/*" -mx=9

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Build' }}
          files: release/MRA-Anime-Edition-Windows.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
